name: Nightly retrain

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC, Mon to Fri, after the US market closes
  workflow_dispatch:           # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/train.py
      - name: Save new data and predictions
        run: |
          git config user.name "stock-lab-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Retrain $(date -u +'%Y-%m-%d')"
          git push
