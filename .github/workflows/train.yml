name: Nightly retrain

on:
  schedule:
    - cron: "15 22 * * 1-5"   # 22:15 UTC, Mon to Fri, after the US market closes
  workflow_dispatch:           # adds a "Run workflow" button on GitHub

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/cell.py
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}   # earnings + news headlines; set under Settings, Secrets
          NEWS_PER_RUN: "1500"                       # headlines looked up per night (about 1 per second)
      - name: Save new data and predictions
        run: |
          git config user.name "stock-lab-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data config
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Retrain $(date -u +'%Y-%m-%d')"
          # someone may have pushed while this was running: take their changes first, then try again
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done
          exit 1
